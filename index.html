<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Find an ACME employee and update their annual base salary. Fictional compensation records only."
    />
    <meta name="theme-color" content="#fafafa" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      const media = matchMedia('(prefers-color-scheme: dark)')
      const apply = () => {
        document.documentElement.classList.toggle('dark', media.matches)
        document.querySelector('meta[name="theme-color"]').content = media.matches ? '#141415' : '#fafafa'
      }
      apply()
      media.addEventListener('change', apply)
    </script>
    <title>ACME Compensation</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
